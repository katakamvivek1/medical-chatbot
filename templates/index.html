<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medical Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="chat">
    <header class="chat__header">
      <h1>Medical Chatbot</h1>
      <p class="chat__note">General health information only &mdash; not medical advice.</p>
    </header>

    <!-- Messages are added here by script.js -->
    <section id="messages" class="chat__messages" aria-live="polite"></section>

    <form id="chat-form" class="chat__form">
      <input id="chat-input" type="text" placeholder="Ask a health question..."
             maxlength="1000" autocomplete="off" required>
      <button id="send-btn" type="submit">Send</button>
    </form>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
